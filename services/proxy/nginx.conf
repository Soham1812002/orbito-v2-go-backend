events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  map $status $log_level {
    ~^5 error;
    ~^4 warn;
    default info;
  }
  map $status $log_outcome {
    ~^5 failure;
    ~^4 rejected;
    default success;
  }
  log_format structured escape=json '{"level":"$log_level","outcome":"$log_outcome","event":"http.access","message":"Proxy request completed","requestId":"$request_id","traceId":"$upstream_http_x_trace_id","method":"$request_method","statusCode":$status,"durationSeconds":$request_time}';
  access_log /dev/stdout structured;
  error_log /dev/stderr warn;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  limit_req_zone $binary_remote_addr zone=web:10m rate=20r/s;

  server {
    listen 80;
    server_name _;
    client_max_body_size 64k;

    location ^~ /internal/ {
      return 404;
    }

    location ^~ /health/ {
      return 404;
    }

    location /socket.io/ {
      proxy_pass http://realtime:3001;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header Host $host;
      proxy_set_header Origin $http_origin;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 75s;
    }

    location / {
      limit_req zone=web burst=40 nodelay;
      proxy_pass http://backend:3000;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
