# Use with compose.yaml. Set HTTP_PORT=80, NODE_ENV=production and HTTPS PUBLIC_ORIGIN.
services:
  nginx:
    ports: ["443:443"]
    environment:
      FLEET_DOMAIN: ${FLEET_DOMAIN:?Set the certificate domain}
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      NGINX_ENVSUBST_FILTER: ^FLEET_DOMAIN$
    volumes:
      - ./infra/nginx/production.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - ${CERTIFICATE_DIR:?Set absolute certificate directory}:/etc/letsencrypt:ro
      - ${ACME_WEBROOT:?Set ACME webroot directory}:/var/www/acme:ro
